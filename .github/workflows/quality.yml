name: Qualité

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Tests
            command: npm test
          - check: Typage
            command: npm run typecheck
          - check: Lint
            command: npm run lint
          - check: Compilation
            command: npm run build
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Utiliser le npm déclaré par le projet
        run: npm install --global npm@11.7.0 --ignore-scripts --no-audit --no-fund
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Exécuter le contrôle
        run: ${{ matrix.command }}
